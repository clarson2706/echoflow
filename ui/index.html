<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EchoFlow</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="ambient"></div>
<div class="app" id="app">
  <aside class="rail glass">
    <div class="brand"><span class="mono" aria-hidden="true">E</span><span class="word">EchoFlow</span></div>
    <nav aria-label="Sections">
      <button class="nav" data-view="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="label">History</span><span class="count" id="cHistory"></span></button>
      <button class="nav" data-view="notes"><svg viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M9 11h6M9 14.5h6M9 18h3"/></svg><span class="label">Notes</span><span class="count" id="cNotes"></span></button>
      <button class="nav" data-view="dictionary"><svg viewBox="0 0 24 24"><path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span class="label">Dictionary</span></button>
      <button class="nav" data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="label">Settings</span></button>
    </nav>
    <button class="update-banner" id="updateBanner" hidden></button>
    <div class="status" id="status" aria-live="polite"></div>
  </aside>

  <main>
    <div class="top">
      <h1 id="title">History</h1>
      <label class="search" id="searchBox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="q" type="search" placeholder="Search everything you have said" aria-label="Search history" autocomplete="off"></label>
      <button class="btn primary" id="noteBtn"><span class="rec"></span>Start note</button>
    </div>
    <section id="view" aria-live="polite"></section>
  </main>

  <aside class="detail glass" id="detail" hidden></aside>
</div>

<div class="live glass" id="live" hidden>
  <div class="head"><span class="rec-dot"></span><strong>Listening</strong><span class="time" id="liveTime">0:00</span>
    <button class="btn small" id="liveCancel">Discard</button><button class="btn small primary" id="liveFinish">Finish note</button></div>
  <div class="tx" id="liveTx"></div>
</div>
<script src="app.js"></script>
</body>
</html>
