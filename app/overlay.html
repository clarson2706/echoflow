<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 500 13px/1 Inter, "Segoe UI", system-ui, sans-serif; color: #26342b; -webkit-font-smoothing: antialiased; user-select: none; }
  .pill { position: absolute; inset: 10px; border-radius: 999px; display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: linear-gradient(180deg, rgba(255,254,249,.94), rgba(247,242,230,.9));
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(180,160,110,.28), 0 8px 26px rgba(60,48,20,.22), 0 0 0 .5px rgba(60,48,20,.12);
    transition: opacity 160ms cubic-bezier(.25,1,.5,1), transform 160ms cubic-bezier(.25,1,.5,1); }
  .pill::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(170deg, rgba(255,255,255,.7), rgba(255,255,255,0) 45%); pointer-events: none; }
  .pill.hide { opacity: 0; transform: translateY(6px) scale(.98); }
  .bars { display: flex; align-items: center; gap: 3px; height: 26px; }
  .bars i { width: 3px; border-radius: 2px; background: #1f4232; height: 4px; transition: height 70ms linear; }
  .label { white-space: nowrap; letter-spacing: .01em; }
  .dots { display: none; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #ba9652; animation: b 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s } .dots i:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%, 80%, 100% { opacity: .3; transform: scale(.8) } 40% { opacity: 1; transform: scale(1.1) } }
  .state-thinking .bars, .state-done .bars, .state-error .bars { display: none; }
  .state-thinking .dots { display: flex; }
  .tick { display: none; width: 18px; height: 18px; border-radius: 50%; background: #1f4232; position: relative; }
  .tick::after { content: ""; position: absolute; left: 6px; top: 3px; width: 4px; height: 8px; border: solid #faf6ec; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .state-done .tick { display: block; }
  .state-error .tick { display: block; background: #a4503e; } .state-error .tick::after { border: 0; left: 8px; top: 4px; width: 2px; height: 10px; background: #faf6ec; transform: none; }
</style>
<div class="pill hide" id="pill">
  <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="dots"><i></i><i></i><i></i></div><div class="tick"></div>
  <span class="label" id="label">Listening</span>
</div>
<script>
  const { ipcRenderer } = require("electron");
  const pill = document.getElementById("pill"), label = document.getElementById("label"), bars = [...document.querySelectorAll("#bars i")];
  let hist = new Array(bars.length).fill(0);
  ipcRenderer.on("overlay:state", (_e, state, text) => {
    pill.className = "pill state-" + state;
    label.textContent = text || ({ listening: "Listening", thinking: "Writing", done: "Inserted", error: "Something went wrong" })[state];
    if (state === "hidden") pill.classList.add("hide");
  });
  ipcRenderer.on("overlay:level", (_e, rms) => {
    hist.push(Math.min(1, rms * 9)); hist.shift();
    bars.forEach((b, i) => b.style.height = 4 + hist[i] * 22 + "px");
  });
</script>
