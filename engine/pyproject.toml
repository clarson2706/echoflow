[project]
name = "echoflow-engine"
version = "0.1.0"
description = "EchoFlow engine: local speech-to-text, cleanup and history store."
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = [
    "faster-whisper>=1.2.1,<2",
    "av>=12,<16",
    "numpy",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# GPU libraries. The packaged app downloads these on first run (hardware.install_cuda_libs); for development
# run `uv sync --extra gpu`.
gpu = [
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echoflow_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
